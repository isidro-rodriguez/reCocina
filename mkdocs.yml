site_name: reCocina
site_description: Recetario de cocina casera
site_author: reCocina
theme:
  name: material
  language: es
  custom_dir: theme
  features:
  - navigation.sections
  - navigation.top
  - search.highlight
  - search.suggest
  - content.code.copy
  palette:
  - scheme: default
    primary: indigo
    accent: indigo
    toggle:
      icon: material/toggle-switch-off-outline
      name: Activar modo oscuro
  - scheme: slate
    primary: indigo
    accent: indigo
    toggle:
      icon: material/toggle-switch
      name: Desactivar modo oscuro
plugins:
- search
markdown_extensions:
- admonition
- abbr
- attr_list
- def_list
- footnotes
- md_in_html
- pymdownx.arithmatex
- pymdownx.betterem
- pymdownx.superfences
- pymdownx.highlight
- pymdownx.details
- pymdownx.tasklist
extra:
  social:
  - icon: fontawesome/brands/github
    link: https://github.com/tu-usuario/recocina
  footer: © 2024 reCocina — Hecho con Material para MkDocs
nav:
- Recetario: index.md
- Aperitivos:
