[project]
name = "recocina"
version = "0.0.0"
description = "Recetario de cocina casera generado con Zensical"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Isidro Rodríguez" }]
dependencies = [
    "zensical==0.0.68",
]

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pre-commit>=3",
    "pydantic>=2.13.5",
    "pytest>=8",
    "pyyaml>=6.0.3",
    "ruff>=0.6",
    "spylls>=0.1.7",
    "ty>=0.0.84",
]

# --- Poe the Poet (opcional) -------------------------------------------------
# Atajos para quien tenga `poe` instalado globalmente (`uv tool install poethepoet`).
# No es dependencia del proyecto: todo se puede ejecutar también con `uv run`.
[tool.poe]
executor.type = "uv"

[tool.poe.tasks.check]
help = "Formato, lint, tipos y tests"
sequence = [
  "ruff format --check .",
  "ruff check .",
  "ty check",
  "pytest",
]
default_item_type = "cmd"

[tool.poe.tasks.fix]
help = "Aplica el formato y las correcciones automáticas de Ruff"
sequence = ["ruff format .", "ruff check --fix ."]
default_item_type = "cmd"

[tool.poe.tasks.build]
help = "Genera el sitio en site/ (misma cadena que vercel.json y la CI)"
sequence = [
  "python scripts/build_recipe_index.py",
  "zensical build --strict",
  "python scripts/build_precache.py",
]
default_item_type = "cmd"

[tool.poe.tasks.serve]
help = "Previsualiza en http://localhost:8000 con el índice de recetas generado"
sequence = ["python scripts/build_recipe_index.py", "zensical serve"]
default_item_type = "cmd"

[tool.poe.tasks.backup]
help = "Copia de seguridad del repositorio con git bundle"
cmd = "python scripts/backup.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["site", "theme"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D", "SIM", "PTH"]
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.environment]
python-version = "3.12"

[tool.ty.analysis]
strict-equality-semantics = true
strict-generic-narrowing = true

[tool.ty.rules]
possibly-unresolved-reference = "error"

[tool.uv]
package = false
