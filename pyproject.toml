[project]
name = "recocina"
version = "0.0.0"
description = "Recetario de cocina casera generado con Zensical"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Isidro Rodríguez" }]
dependencies = [
    "zensical==0.0.68",
]

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pre-commit>=3",
    "pydantic>=2.13.5",
    "pytest>=8",
    "pyyaml>=6.0.3",
    "ruff>=0.6",
    "spylls>=0.1.7",
    "ty>=0.0.84",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["site", "theme"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D", "SIM", "PTH"]
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.environment]
python-version = "3.12"

[tool.ty.analysis]
strict-equality-semantics = true
strict-generic-narrowing = true

[tool.ty.rules]
possibly-unresolved-reference = "error"

[tool.uv]
package = false
