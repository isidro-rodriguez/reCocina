[project]
name = "recocina"
version = "2026.10.03"
description = "Recetario de cocina casera generado con Zensical"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Isidro Rodríguez" }]
dependencies = [
    "zensical",
]

[dependency-groups]
dev = [
    "mdformat>=1.0.0",
    "mdformat-mkdocs>=5.3",
    "pre-commit>=3",
    "pytest>=8",
    "ruff>=0.6",
    "spylls>=0.1.7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["site", "theme"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PTH"]
