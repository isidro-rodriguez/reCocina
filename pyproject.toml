[project]
name = "recocina"
version = "2026.10.03"
description = "Recetario de cocina casera generado con Zensical"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Isidro Rodríguez" }]
dependencies = [
    "zensical",
]

[dependency-groups]
dev = [
    "mdformat>=1.0.0",
    "mdformat-mkdocs>=5.3",
    "pre-commit>=3",
    "pytest>=8",
    "ruff>=0.6",
    "spylls>=0.1.7",
    "ty>=0.0.84",
    "djlint>=1.46",
    "jsbeautifier>=2.0",
    "cssbeautifier>=2.0",
]

[tool.djlint]
profile = "jinja"
indent = 4

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["site", "theme"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D", "SIM", "PTH"]
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.environment]
python-version = "3.12"

[tool.ty.analysis]
strict-equality-semantics = true
strict-generic-narrowing = true

[tool.ty.rules]
possibly-unresolved-reference = "error"

[tool.uv]
package = false
