# Configuración de mdformat (formateador de Markdown).
# mdformat NO lee pyproject.toml: requiere este fichero .mdformat.toml.
# Docs: https://mdformat.readthedocs.io/en/stable/users/configuration_file.html
wrap = "keep"          # no reescribe el salto de línea de las recetas
end_of_line = "keep"   # respeta el fin de línea existente (CRLF/LF)
number = true          # listas ordenadas numeradas consecutivamente (1. 2. 3.)

[plugin.mkdocs]
# Soporte de la sintaxis de MkDocs Material (admoniciones, tabs, etc.)
align_semantic_breaks_in_lists = false
